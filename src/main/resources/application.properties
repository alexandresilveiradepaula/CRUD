spring.application.name=assistencia-tecnica
server.port=8080

# Gerenciamento de Sessão - Expiração por inatividade (RN02 / Requisitos)
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Configuração de Banco de Dados MySQL (phpMyAdmin / localhost)
spring.datasource.url=jdbc:mysql://localhost:3306/assistenciadb?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Criação e atualização automática das tabelas no MySQL pelo Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Execução resiliente de scripts SQL (schema.sql e data.sql) (RN01)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Codificação
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Assistência Técnica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-login {
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border: none;
        }
    </style>
</head>
<body>
    <div class="card card-login bg-white p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 bg-primary bg-opacity-10 text-primary rounded-circle mb-2">
                <i class="bi bi-tools fs-1"></i>
            </div>
            <h4 class="fw-bold text-dark mt-2">Assistência Técnica</h4>
            <p class="text-muted small">Controle e Gestão de Atendimentos</p>
        </div>

        <!-- RN02: Validação em caso de falha na autenticação -->
        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5 me-2 flex-shrink-0"></i>
            <div class="small">Usuário ou senha inválidos. Por favor, verifique suas credenciais e tente novamente.</div>
        </div>

        <!-- Feedback de Expiração de Sessão -->
        <div th:if="${param.expired}" class="alert alert-warning d-flex align-items-center py-2" role="alert">
            <i class="bi bi-clock-history fs-5 me-2 flex-shrink-0"></i>
            <div class="small">Sua sessão expirou por inatividade. Faça login novamente para continuar.</div>
        </div>

        <!-- Feedback de Logout -->
        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center py-2" role="alert">
            <i class="bi bi-check-circle-fill fs-5 me-2 flex-shrink-0"></i>
            <div class="small">Você saiu do sistema com sucesso.</div>
        </div>

        <!-- Formulário de Autenticação -->
        <form th:action="@{/login}" method="post">
            <!-- CSRF Token explícito para segurança do Spring Security -->
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold">Login / Usuário</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person text-secondary"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="ex: admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold">Senha de Acesso</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock text-secondary"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Entrar no Sistema
            </button>
        </form>

        <div class="text-center mt-4 text-muted small">
            <span>Credenciais padrão para testes: <strong>admin / 123456</strong></span>
        </div>
    </div>
</body>
</html>
